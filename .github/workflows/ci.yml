name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: littoral_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@v4

      - name: Install SBCL
        run: |
          sudo apt-get update
          sudo apt-get install -y sbcl libev-dev

      - name: Cache ocicl
        uses: actions/cache@v4
        with:
          path: |
            ~/.local/share/ocicl
            ~/.local/bin/ocicl
            ocicl
          key: ocicl-${{ runner.os }}-${{ hashFiles('ocicl.csv') }}

      - name: Install ocicl
        run: |
          if [ ! -x ~/.local/bin/ocicl ]; then
            git clone --depth 1 https://github.com/ocicl/ocicl.git /tmp/ocicl
            (cd /tmp/ocicl && sbcl --non-interactive --load setup.lisp)
          fi
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Set up the ocicl runtime
        run: ocicl setup > ~/.sbclrc

      - name: Fetch dependencies
        # Registry downloads occasionally drop; ocicl install is resumable.
        run: |
          for attempt in 1 2 3 4; do
            ocicl install && exit 0
            echo "ocicl install failed (attempt $attempt); retrying"
            sleep $((attempt * 10))
          done
          exit 1

      - name: Start an S3-compatible server, for the S3 tests
        # RustFS checks Signature V4 like S3 (MinIO no longer publishes images).
        # The S3 test runs only if it comes up; the build doesn't depend on it.
        run: |
          if docker run -d --name s3 -p 9000:9000 rustfs/rustfs:latest; then
            for i in $(seq 1 60); do
              code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:9000/ || true)
              if [ "$code" != "000" ] && [ "$code" != "503" ]; then
                { echo "LITTORAL_TEST_S3=http://127.0.0.1:9000"; echo "LITTORAL_TEST_S3_KEY=rustfsadmin";
                  echo "LITTORAL_TEST_S3_SECRET=rustfsadmin"; } >> "$GITHUB_ENV"
                echo "S3 server is up (HTTP $code)"; break
              fi
              sleep 1
            done
            docker logs s3 2>&1 | tail -20
          fi

      - name: Unit tests
        run: |
          sbcl --non-interactive \
            --eval '(asdf:initialize-source-registry (list :source-registry (list :directory (uiop:getcwd)) :inherit-configuration))' \
            --eval '(asdf:test-system :littoral)'

      - name: Database tests on PostgreSQL
        env:
          LITTORAL_TEST_DATABASE: postgres://postgres:postgres@127.0.0.1:5432/littoral_test
        run: |
          sbcl --non-interactive \
            --eval '(asdf:initialize-source-registry (list :source-registry (list :directory (uiop:getcwd)) :inherit-configuration))' \
            --eval '(asdf:load-system :littoral/tests)' \
            --eval '(littoral/tests::run-database-suites)'

      - name: A generated project
        run: |
          sbcl --non-interactive \
            --eval '(asdf:initialize-source-registry (list :source-registry (list :directory (uiop:getcwd)) :inherit-configuration))' \
            --eval '(asdf:load-system :littoral/generator)' \
            --eval '(littoral.generator:make-project "ci-app" :directory "/tmp/ci-app/" :author "CI")'
          make -C /tmp/ci-app test 2>&1 | tee /tmp/ci-app.log | grep -v '^;'
          grep -q "Fail: 0" /tmp/ci-app.log

      - name: Browser and accessibility tests
        run: |
          sbcl --non-interactive \
            --eval '(asdf:initialize-source-registry (list :source-registry (list :directory (uiop:getcwd)) :inherit-configuration))' \
            --eval '(asdf:load-system :littoral/examples)' \
            --eval '(asdf:load-system :littoral/tracker)' --eval '(littoral-tracker:register-tracker)' \
            --eval '(asdf:load-system :littoral/tutorial)' --eval '(reading-list:register)' \
            --eval '(asdf:load-system :littoral/admin-demo)' --eval '(littoral-admin-demo:register)' \
            --eval '(asdf:load-system :littoral/members-demo)' --eval '(littoral-members-demo:register :file (format nil "/tmp/members-~D.sqlite3" (random 1000000 (make-random-state t))))' \
            --eval '(asdf:load-system :littoral/storage-demo)' --eval '(littoral-gallery:register)' \
            --eval '(asdf:load-system :littoral/search-demo)' --eval '(littoral-search-demo:register)' \
            --eval '(asdf:load-system :littoral/parenscript-demo)' --eval '(littoral-parenscript-demo:register)' \
            --eval '(asdf:load-system :littoral/websocket)' \
            --eval '(setf littoral:*new-sessions-per-minute* nil)' --eval '(littoral:start :port 8765)' --eval '(sleep 900)' > server.log 2>&1 &
          for i in $(seq 1 120); do curl -s -o /dev/null http://127.0.0.1:8765/ && break; sleep 1; done
          export BASE=http://127.0.0.1:8765 CHROME="$(command -v google-chrome || command -v chromium)"
          node tests/e2e/browser.mjs
          node tests/e2e/accessibility.mjs

      - name: Chrome tests in Lisp (littoral/browser-test)
        run: |
          CHROME="$(command -v google-chrome || command -v chromium)" sbcl --non-interactive \
            --eval '(asdf:initialize-source-registry (list :source-registry (list :directory (uiop:getcwd)) :inherit-configuration))' \
            --eval '(asdf:load-system :littoral/chrome-tests)' \
            --eval '(uiop:quit (if (littoral/chrome-tests:run-chrome-tests) 0 1))' 2>&1 | grep -v '^;'
          test "${PIPESTATUS[0]}" = 0

      - name: Browser tests on Woo
        run: |
          sbcl --non-interactive \
            --eval '(asdf:initialize-source-registry (list :source-registry (list :directory (uiop:getcwd)) :inherit-configuration))' \
            --eval '(asdf:load-system :littoral/examples)' \
            --eval '(asdf:load-system :littoral/tracker)' --eval '(littoral-tracker:register-tracker)' \
            --eval '(asdf:load-system :littoral/tutorial)' --eval '(reading-list:register)' \
            --eval '(asdf:load-system :littoral/admin-demo)' --eval '(littoral-admin-demo:register)' \
            --eval '(asdf:load-system :littoral/members-demo)' --eval '(littoral-members-demo:register :file (format nil "/tmp/members-~D.sqlite3" (random 1000000 (make-random-state t))))' \
            --eval '(asdf:load-system :littoral/storage-demo)' --eval '(littoral-gallery:register)' \
            --eval '(asdf:load-system :littoral/search-demo)' --eval '(littoral-search-demo:register)' \
            --eval '(asdf:load-system :littoral/parenscript-demo)' --eval '(littoral-parenscript-demo:register)' \
            --eval '(asdf:load-system :littoral/websocket)' \
            --eval '(asdf:load-system :littoral/woo)' \
            --eval '(setf littoral:*new-sessions-per-minute* nil)' --eval '(littoral:start :port 8766 :server :woo)' --eval '(sleep 900)' > woo-server.log 2>&1 &
          for i in $(seq 1 120); do curl -s -o /dev/null http://127.0.0.1:8766/ && break; sleep 1; done
          LITTORAL_SERVER=woo BASE=http://127.0.0.1:8766 CHROME="$(command -v google-chrome || command -v chromium)" node tests/e2e/browser.mjs

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install SBCL
        run: |
          sudo apt-get update
          sudo apt-get install -y sbcl

      - name: Cache ocicl
        uses: actions/cache@v4
        with:
          path: |
            ~/.local/share/ocicl
            ~/.local/bin/ocicl
            ocicl
          key: ocicl-${{ runner.os }}-${{ hashFiles('ocicl.csv') }}

      - name: Install ocicl and fetch dependencies
        run: |
          if [ ! -x ~/.local/bin/ocicl ]; then
            git clone --depth 1 https://github.com/ocicl/ocicl.git /tmp/ocicl
            (cd /tmp/ocicl && sbcl --non-interactive --load setup.lisp)
          fi
          export PATH="$HOME/.local/bin:$PATH"
          ocicl setup > ~/.sbclrc
          for attempt in 1 2 3 4; do
            ocicl install && exit 0
            sleep $((attempt * 10))
          done
          exit 1

      - name: The demo image (make docker)
        run: |
          make docker
          docker run -d --name demo -p 127.0.0.1:8099:8080 littoral-demo
          for i in $(seq 1 60); do curl -fsS http://127.0.0.1:8099/healthz && break; sleep 1; done
          for page in /examples /examples/members /examples/search /examples/gallery /tracker; do
            test "$(curl -s -o /dev/null -w '%{http_code}' -L http://127.0.0.1:8099$page)" = 200 || { echo "$page failed"; docker logs demo; exit 1; }
          done

      - name: A generated project's image
        run: |
          sbcl --non-interactive \
            --eval '(asdf:initialize-source-registry (list :source-registry (list :directory (uiop:getcwd)) :inherit-configuration))' \
            --eval '(asdf:load-system :littoral/generator)' \
            --eval '(littoral.generator:make-project "ci-app" :directory "/tmp/ci-app/" :author "CI" :template "app")'
          make -C /tmp/ci-app docker
          docker run -d --name app -p 127.0.0.1:8098:8080 -e PUBLIC_URL=http://localhost:8098 -v ci-app-data:/data ci-app
          for i in $(seq 1 60); do curl -fsS http://127.0.0.1:8098/healthz && break; sleep 1; done
          docker exec app ci-app create-user ada ada@example.org 'a long passphrase' admin | grep -q "Added ada"
          test "$(curl -s -o /dev/null -w '%{http_code}' -L http://127.0.0.1:8098/)" = 200 || { docker logs app; exit 1; }
